<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 걷기 좋은가</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --muted: #6b6b6b;
    --line: #e6e6e6;
    --good: #1a7f4b;
    --normal: #b7791f;
    --rest: #c53030;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 420px; }
  .card { display: none; }
  .card.active { display: block; }

  /* 1. 한 줄 판단 */
  .verdict { font-size: 2.2rem; font-weight: 800; margin: 24px 0 8px; line-height: 1.25; }
  .verdict.good { color: var(--good); }
  .verdict.normal { color: var(--normal); }
  .verdict.rest { color: var(--rest); }

  /* 2. 근거 숫자 (작게) */
  .facts {
    list-style: none; padding: 0; margin: 16px 0 0;
    display: flex; flex-wrap: wrap; gap: 8px 16px;
    font-size: 0.8rem; color: var(--muted);
  }
  .facts b { color: var(--text); font-weight: 600; }

  /* 대기 상태 칩 (판단보다 작게) */
  .chip {
    display: inline-block; margin: 0 0 4px; padding: 4px 12px;
    border: 1px solid var(--line); border-radius: 12px;
    font-size: 0.8rem; color: var(--muted);
  }
  .chip b { font-weight: 700; }
  .chip.good b { color: var(--good); }
  .chip.normal b { color: var(--normal); }
  .chip.bad b, .chip.worst b { color: var(--rest); }
  .chip.worst b { color: #8b1a1a; }
  .chip:empty { display: none; }
  .note { margin: 8px 0 0; min-height: 0; font-size: 0.75rem; color: var(--muted); }
  .note:empty { display: none; }

  /* 시간별 리스트 (판단 아래에 조용하게) */
  .best { margin: 8px 0; font-size: 0.85rem; font-weight: 600; color: var(--good); min-height: 1em; }
  .hours { list-style: none; margin: 0; padding: 0; font-size: 0.8rem; color: var(--muted); }
  .hours li, .skeleton .row, .hours-head {
    display: grid; grid-template-columns: 3.2rem 4.2rem 1fr 3.6rem 3rem;
    gap: 8px; align-items: baseline;
    padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .hours-head { padding: 4px 0; font-size: 0.7rem; color: var(--muted); }
  .hours-head span:nth-child(4), .hours-head span:nth-child(5) { text-align: right; }
  .hours .time { color: var(--text); }
  .hours .lv.good { color: var(--good); }
  .hours .lv.normal { color: var(--normal); }
  .hours .lv.rest { color: var(--rest); }
  .hours .num { text-align: right; }
  .hours .air { font-size: 0.72rem; color: var(--muted); }
  .hours .air.bad, .hours .air.worst { color: var(--rest); }
  .hours li.is-best { background: #f5faf7; font-weight: 600; }
  .skeleton { margin-top: 8px; }
  .skeleton .row { height: 34px; }
  .skeleton .row::before { content: ""; grid-column: 1 / -1; height: 10px; border-radius: 6px; background: var(--line); align-self: center; }

  /* 3. 출처 자리 */
  .source {
    margin-top: 32px; padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 0.75rem; color: var(--muted);
  }

  /* 로딩·실패: 판단 문구 자리에 들어가는 안내 (판단보다는 조용하게) */
  .status { font-size: 1.5rem; font-weight: 700; margin: 24px 0 8px; line-height: 1.35; color: var(--muted); }
  .status.error { font-size: 1rem; font-weight: 600; color: var(--muted); }
  .source a { color: var(--muted); text-decoration: underline; }
  #retry { margin-top: 16px; }
  .spinner {
    width: 24px; height: 24px; margin-top: 16px;
    border: 3px solid var(--line); border-top-color: var(--text);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  button {
    background: #000; color: #fff; border: 0;
    border-radius: 12px; padding: 12px 20px;
    font-size: 0.95rem; cursor: pointer;
  }

  .choices { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .choices button { padding: 8px 16px; font-size: 0.85rem; text-align: left; }

  /* 지역 입력 (판단보다 눈에 덜 띄게 작게) */
  .search { margin-top: 32px; display: flex; gap: 8px; }
  .search input {
    flex: 1; min-width: 0; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 12px;
    font-size: 0.85rem; color: var(--text); background: var(--bg);
  }
  .search button { padding: 8px 16px; font-size: 0.85rem; }
  .tip { margin: 8px 0 0; font-size: 0.75rem; color: var(--muted); }
  .hint { margin: 8px 0 0; min-height: 1em; font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <!-- 로딩 중 -->
  <section id="loading" class="card" role="status">
    <p class="status">날씨를 불러오는 중이에요</p>
    <div class="spinner" aria-hidden="true"></div>
    <p class="chip">대기 정보 확인 중…</p>
  </section>

  <!-- 불러오기 실패: 원인별 문구는 showError()가 넣는다 -->
  <section id="error" class="card" role="alert">
    <p id="error-text" class="status error"></p>
    <button id="retry" type="button" hidden>다시 시도</button>
  </section>

  <!-- 후보가 여러 개일 때 고르는 화면 -->
  <section id="choose" class="card">
    <p class="status">어느 지역인가요?</p>
    <ul id="choices" class="choices"></ul>
  </section>

  <!-- 결과: 판단 → 근거 → 출처 -->
  <section id="result" class="card">
    <h1 id="verdict" class="verdict"></h1>
    <p id="air" class="chip"></p>
    <ul class="facts">
      <li>지역 <b id="place"></b></li>
      <li>기온 <b id="temp"></b></li>
      <li>강수 <b id="rain"></b></li>
      <li>바람 <b id="wind"></b></li>
    </ul>
    <p id="note" class="note"></p>
  </section>

  <form id="search" class="search">
    <input id="city" type="text" placeholder="도시 이름 (예: 서울, 인천, 부산)" aria-label="도시 이름" autocomplete="off">
    <button type="submit">확인</button>
  </form>
  <p class="tip">도시 단위로 알려드려요</p>
  <p id="hint" class="hint" role="status"></p>

  <!-- 시간별 리스트: 결과일 때만 보임 (show()가 켜고 끈다) -->
  <section id="list" class="card">
    <p id="best" class="best"></p>
    <div class="hours-head" aria-hidden="true">
      <span>시각</span><span>판단</span><span>대기</span><span>기온</span><span>강수확률</span>
    </div>
    <ul id="hours" class="hours" aria-label="앞으로 12시간 예보"></ul>
  </section>

  <!-- 리스트 자리 표시: 로딩 중에만 보임 -->
  <section id="skeleton" class="card skeleton" aria-hidden="true">
    <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
  </section>

  <!-- 출처: 로딩·성공·실패 모든 화면에서 항상 보인다 -->
  <p class="source">출처: 날씨 <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    · 공기질 <a href="https://open-meteo.com/en/docs/air-quality-api" target="_blank" rel="noopener">Open-Meteo 공기질 API</a> (Copernicus CAMS 모델 예측값이며 측정값이 아니에요)</p>
</main>

<script>
  // ── 대기(미세먼지) 등급 기준 — 환경부/에어코리아 기준, ㎍/㎥ ─────────────────────
  //            좋음   보통    나쁨    매우 나쁨
  //  PM10      ~30    ~80    ~150    151~     (미세먼지)
  //  PM2.5     ~15    ~35    ~75     76~      (초미세먼지)
  //  · 에어코리아의 공식 등급은 하루 평균 예측 기준이고, 여기서는 현재 시간값에 같은 경계를 적용한다
  //  · 두 항목 중 더 나쁜 등급으로 정한다. "나쁨" 이상이면 한 줄 판단과 시간별 줄을 한 단계 낮춘다
  const AIR_LIMITS = { pm10: [30, 80, 150], pm2_5: [15, 35, 75] };
  const AIR_GRADES = [
    { text: "대기 좋음", cls: "good" },
    { text: "대기 보통", cls: "normal" },
    { text: "대기 나쁨", cls: "bad" },
    { text: "대기 매우 나쁨", cls: "worst" },
  ];

  // 인증키 불필요 (Open-Meteo)
  const AIR_URL = "https://air-quality-api.open-meteo.com/v1/air-quality";
  const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
  const WEATHER_URL = "https://api.open-meteo.com/v1/forecast";
  // "서울"처럼 짧은 한국어 이름은 지오코딩이 못 찾거나 엉뚱한 마을을 줘서, 행정구역 접미사도 같이 찾는다
  const SUFFIXES = ["", "특별시", "광역시", "특별자치시", "특별자치도", "시"];
  let current = { name: "서울", latitude: 37.566, longitude: 126.9784 };

  // weather_code는 WMO 코드: 0~3 맑음/구름, 45~48 안개, 51 이상 비·눈 등
  function judge(c) {
    const t = c.temperature_2m, p = c.precipitation, w = c.wind_speed_10m, code = c.weather_code;
    if (p >= 1 || code >= 61 || w >= 40 || t <= -5 || t >= 33) return { text: "쉬는 게 좋아요", cls: "rest" };
    if (p > 0 || code >= 45 || w >= 25 || t < 3 || t > 28) return { text: "보통이에요", cls: "normal" };
    return { text: "걷기 좋아요", cls: "good" };
  }

  // 값 → 등급 번호(0 좋음 ~ 3 매우 나쁨). 소수는 반올림해서 경계와 비교한다
  function airGrade(value, limits) {
    const v = Math.round(value);
    const i = limits.findIndex(max => v <= max);
    return i === -1 ? limits.length : i;
  }

  // 미세먼지·초미세먼지 중 더 나쁜 등급. 값이 없으면 null
  function airLevelOf(pm10, pm25) {
    if (pm10 == null || pm25 == null) return null;
    return Math.max(airGrade(pm10, AIR_LIMITS.pm10), airGrade(pm25, AIR_LIMITS.pm2_5));
  }

  // 대기가 나쁨 이상이면 판단을 한 단계 낮춘다 (걷기 좋아요 → 보통이에요 → 쉬는 게 좋아요)
  function lowerJudge(j) {
    if (j.cls === "good") return { text: "보통이에요", cls: "normal" };
    if (j.cls === "normal") return { text: "쉬는 게 좋아요", cls: "rest" };
    return j;
  }

  function renderAir(air) {
    const el = document.getElementById("air");
    if (!air) {
      el.className = "chip";
      el.textContent = "대기 정보를 불러오지 못했어요";
      return 0;
    }
    const level = airLevelOf(air.pm10, air.pm2_5);
    el.className = "chip " + AIR_GRADES[level].cls;
    el.textContent = "";
    const b = document.createElement("b");
    b.textContent = AIR_GRADES[level].text;
    el.append(b, " · 미세먼지 " + Math.round(air.pm10) + " · 초미세먼지 " + Math.round(air.pm2_5) + "㎍/㎥"
      + (level >= 2 ? " · 마스크를 챙기세요" : ""));
    return level;
  }

  // 시간별 예보에는 기온·강수확률만 있다 (바람·날씨코드 없음)
  const LEVELS = [
    { cls: "good", text: "걷기 좋음" },
    { cls: "normal", text: "보통" },
    { cls: "rest", text: "쉼" },
  ];
  function hourLevel(t, prob) {
    if (prob >= 60 || t <= -5 || t >= 33) return 2;
    if (prob >= 30 || t < 3 || t > 28) return 1;
    return 0;
  }

  // 현재 시각이 속한 시간부터 12개. 시각은 요청한 timezone의 현지 시간 문자열이라 문자열 비교로 충분하다
  function renderHours(hourly, nowTime, air) {
    const start = hourly.time.findIndex(t => t >= nowTime.slice(0, 13) + ":00");
    const rows = [];
    for (let i = Math.max(start, 0); i < hourly.time.length && rows.length < 12; i++) {
      const t = hourly.temperature_2m[i], p = hourly.precipitation_probability[i];
      // 그 시각의 대기가 나쁨 이상이면 한 단계 낮춘다. 대기 등급은 모든 줄에 작게 표시한다
      const k = air ? air.hourly.time.indexOf(hourly.time[i]) : -1;
      const al = k < 0 ? null : airLevelOf(air.hourly.pm10[k], air.hourly.pm2_5[k]);
      const lv = Math.min(2, hourLevel(t, p) + (al >= 2 ? 1 : 0));
      rows.push({ time: hourly.time[i], t, p, lv, al });
    }
    // 가장 걷기 좋은 시간: 등급 → 대기 → 강수확률 → 18°C에 가까운 기온 → 빠른 시각 순
    const better = (b, a) => {
      if (b.lv !== a.lv) return b.lv < a.lv;
      if ((b.al || 0) !== (a.al || 0)) return (b.al || 0) < (a.al || 0);
      if (b.p !== a.p) return b.p < a.p;
      return Math.abs(b.t - 18) < Math.abs(a.t - 18);
    };
    const best = rows.reduce((a, b) => (better(b, a) ? b : a));
    const hasBest = rows.length > 0 && best.lv < 2;

    const ul = document.getElementById("hours");
    ul.textContent = "";
    rows.forEach((r, i) => {
      const li = document.createElement("li");
      if (hasBest && r === best) li.className = "is-best";
      const cells = [
        ["time", i === 0 ? "지금" : Number(r.time.slice(11, 13)) + "시"],
        ["lv " + LEVELS[r.lv].cls, LEVELS[r.lv].text],
        // 열 제목이 "대기"라서 "대기 "는 뗀다. 공기질을 못 불러온 시각은 빈칸
        ["air " + (r.al == null ? "" : AIR_GRADES[r.al].cls), r.al == null ? "" : AIR_GRADES[r.al].text.replace("대기 ", "")],
        ["num", r.t + "°C"],
        ["num", r.p + "%"],
      ];
      cells.forEach(([cls, text]) => {
        const s = document.createElement("span");
        s.className = cls;
        s.textContent = text;
        li.appendChild(s);
      });
      ul.appendChild(li);
    });
    const label = rows.indexOf(best) === 0 ? "지금" : Number(best.time.slice(11, 13)) + "시";
    document.getElementById("best").textContent = hasBest ? label + "이 제일 좋아요" : "";
  }

  function show(state) {
    document.querySelectorAll(".card").forEach(el => el.classList.remove("active"));
    const ids = [state];
    if (state === "result") ids.push("list");
    if (state === "loading") ids.push("skeleton");
    ids.forEach(id => document.getElementById(id).classList.add("active"));
  }

  function render(data, place, air) {
    const c = data.current, u = data.current_units;
    const level = renderAir(air);
    const j = level >= 2 ? lowerJudge(judge(c)) : judge(c);
    renderHours(data.hourly, c.time, air);
    document.getElementById("place").textContent = place;
    document.getElementById("note").textContent = current.note || "";
    const v = document.getElementById("verdict");
    v.textContent = j.text;
    v.className = "verdict " + j.cls;
    document.getElementById("temp").textContent = c.temperature_2m + u.temperature_2m;
    document.getElementById("rain").textContent = c.precipitation + u.precipitation;
    document.getElementById("wind").textContent = c.wind_speed_10m + u.wind_speed_10m;
    show("result");
  }

  // 한국 결과만 검색 (같은 이름의 북한 지명이 먼저 잡히는 것을 막는다)
  async function geoSearch(name) {
    const url = GEO_URL + "?count=10&language=ko&countryCode=KR&name=" + encodeURIComponent(name);
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return (await res.json()).results || [];
  }

  // 이름 하나로 검색. 접미사 후보까지 함께 찾아 id로 중복을 없앤다
  async function searchAll(name) {
    const lists = await Promise.all(SUFFIXES.map(s => geoSearch(name + s)));
    const seen = new Set();
    return lists.flat().filter(r => !seen.has(r.id) && seen.add(r.id));
  }

  // 인구 정보가 있는 큰 도시가 있으면 그것 하나만, 없으면(동·마을) 전부 후보로 돌려준다
  function pickBigCity(results) {
    const big = results.filter(r => r.population);
    return big.length ? [big.reduce((a, b) => (b.population > a.population ? b : a))] : results;
  }

  // 쉼표 검색("중앙동, 서울특별시")은 시·도 정식 이름일 때만 짝지어진다 → 약칭을 정식 이름으로 바꾼다
  const SIDO = {
    서울: "서울특별시", 부산: "부산광역시", 대구: "대구광역시", 인천: "인천광역시", 광주: "광주광역시",
    대전: "대전광역시", 울산: "울산광역시", 세종: "세종특별자치시", 경기: "경기도", 강원: "강원도",
    충북: "충청북도", 충남: "충청남도", 전북: "전라북도", 전남: "전라남도", 경북: "경상북도",
    경남: "경상남도", 제주: "제주특별자치도",
  };
  function toSido(word) {
    const key = word.replace(/(특별시|광역시|특별자치시|특별자치도|도|시)$/, "");
    return SIDO[key] || null;
  }

  // 한글이 들어 있는 지명만 쓴다 (영어 이름이 섞여 오는 경우가 있다)
  const hangul = s => /[가-힣]/.test(s || "");
  function placeLabel(r, fallbackName) {
    const parts = [r.admin1, r.admin2, r.admin3, r.name].filter(hangul);
    if (!hangul(r.name) && !hangul(r.admin3) && fallbackName) parts.push(fallbackName);
    return parts.filter((p, i) => parts.indexOf(p) === i).join(" ");
  }

  // 입력 → { name: 검색한 이름, places: 후보 목록, fallback: 넓혀서 찾았는지 }.
  // "서울 구로동"과 "구로동, 서울"을 같은 뜻으로 보고, 지역은 시·도면 쉼표 형식으로 서버에서, 구·시면 결과에서 거른다.
  // 동을 못 찾으면 구 → 시 → 시·도 순으로 한 단계씩 넓힌다 (구 이름은 대부분 데이터에 없다)
  async function findPlaces(query) {
    const words = query.split(/[\s,]+/).filter(Boolean);
    const name = words.length === 1 ? words[0] : query.includes(",") ? words.shift() : words.pop();
    const region = words.length === 1 && words[0] === name ? [] : words;
    if (!region.length) return { name, places: pickBigCity(await searchAll(name)), fallback: false };

    const sido = toSido(region.find(toSido) || "");
    const rest = region.filter(w => !toSido(w));
    const inSido = r => !sido || r.admin1 === sido;
    const exact = (await geoSearch(sido ? name + ", " + sido : name)).filter(r => {
      const text = [r.admin1, r.admin2, r.admin3, r.admin4].filter(Boolean).join(" ");
      return rest.every(w => text.includes(w));
    });
    if (exact.length) return { name, places: exact, fallback: false };

    const gu = rest.find(w => /[구군]$/.test(w));
    const steps = [];
    // 구: 같은 이름의 다른 지역(강남구 → 충남 부여 강남구렁고개)을 막으려고 시·도가 맞고 이름이 같을 때만 받는다
    if (gu) steps.push(async () => (await geoSearch(sido ? gu + ", " + sido : gu))
      .filter(r => inSido(r) && [r.name, r.admin2, r.admin3].includes(gu)));
    rest.filter(w => w !== gu).forEach(w => steps.push(async () => pickBigCity((await searchAll(w)).filter(inSido))));
    // 시·도: 특별시·광역시만 점으로 있다 ("경기도"는 김포의 마을이 걸린다) → 인구 정보가 있는 결과만 받는다
    if (sido) steps.push(async () => (await searchAll(sido)).filter(r => r.admin1 === sido && r.population));
    for (const step of steps) {
      const places = await step();
      if (places.length) return { name, places, fallback: true };
    }
    return { name, places: [], fallback: false };
  }

  // "구로동은" / "정자동은"처럼 받침에 맞는 조사
  function eunNeun(word) {
    const c = word.charCodeAt(word.length - 1);
    return word + (c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 === 0 ? "는" : "은");
  }

  // 후보가 여러 개일 때 고르는 화면
  function renderChoices(places, fallbackName, note) {
    const ul = document.getElementById("choices");
    ul.textContent = "";
    places.forEach(p => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = placeLabel(p, fallbackName);
      b.addEventListener("click", () => {
        current = { name: placeLabel(p, fallbackName), latitude: p.latitude, longitude: p.longitude, note };
        run();
      });
      li.appendChild(b);
      ul.appendChild(li);
    });
    show("choose");
  }

  // 원인별 실패 화면. 다시 시도 버튼은 연결/서버 오류일 때만 보인다
  const ERRORS = {
    notfound: () => "도시를 찾지 못했어요. 도시 이름으로 입력해 보세요 (예: 서울)",
    // 구·동은 지오코딩 데이터에 거의 없다 → 도시 이름으로 안내한다
    neighborhood: () => "동네까지는 찾지 못했어요. 도시 이름으로 입력해 보세요 (예: 서울)",
    network: () => "날씨를 불러오지 못했어요. 연결을 확인해 주세요",
  };
  let retryAction = null;

  function showError(kind, name) {
    document.getElementById("error-text").textContent = ERRORS[kind](name);
    document.getElementById("retry").hidden = kind !== "network";
    show("error");
  }

  async function fetchWeather() {
    const url = WEATHER_URL + "?latitude=" + current.latitude + "&longitude=" + current.longitude
      + "&current=temperature_2m,precipitation,wind_speed_10m,weather_code"
      + "&hourly=temperature_2m,precipitation_probability&timezone=auto";
    // 공기질은 따로 실패해도 날씨는 보여준다 (실패하면 null)
    const airPromise = fetchAir().catch(e => { console.error(e); return null; });
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json(), current.name, await airPromise);
  }

  async function fetchAir() {
    const url = AIR_URL + "?latitude=" + current.latitude + "&longitude=" + current.longitude
      + "&current=pm10,pm2_5&hourly=pm10,pm2_5&timezone=auto";
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const c = data.current;
    if (c.pm10 == null || c.pm2_5 == null) throw new Error("공기질 값이 비어 있어요");
    return { pm10: c.pm10, pm2_5: c.pm2_5, hourly: data.hourly };
  }

  // 도시 검색(name이 있으면)과 날씨 호출을 한 번에. 다시 시도는 같은 동작을 반복한다
  async function run(name) {
    retryAction = () => run(name);
    document.getElementById("hint").textContent = "";
    show("loading");
    try {
      if (name) {
        const found = await findPlaces(name);
        // 넓혀서 찾은 경우엔 검색한 동 이름을 지명 대신 쓰지 않는다
        const fb = found.fallback ? "" : found.name;
        // 영어 이름이 섞여 와서 한글 표시가 같아지는 후보는 하나로 합친다
        const seen = new Set();
        const places = found.places.filter(r => {
          const label = placeLabel(r, fb);
          return !seen.has(label) && seen.add(label);
        });
        if (!places.length) {
          const last = name.split(/[\s,]+/).filter(Boolean).pop();
          showError(/(동|읍|면|리|구|군)$/.test(last) ? "neighborhood" : "notfound");
          return;
        }
        // 동을 못 찾아 넓혀서 찾았으면 어떤 이름으로 대체했는지 알려 준다
        const note = found.fallback ? placeLabel(places[0], fb) + " 기준이에요 (" + eunNeun(found.name) + " 찾지 못했어요)" : "";
        if (places.length > 1) { renderChoices(places, fb, note); return; }
        current = { name: placeLabel(places[0], fb), latitude: places[0].latitude, longitude: places[0].longitude, note };
      }
      await fetchWeather();
    } catch (e) {
      console.error(e);
      showError("network");
    }
  }

  document.getElementById("search").addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("city").value.trim();
    if (!name) { document.getElementById("hint").textContent = "도시 이름을 입력해 주세요."; return; }
    run(name);
  });

  document.getElementById("retry").addEventListener("click", () => retryAction());

  run();
</script>
</body>
