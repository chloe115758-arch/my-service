<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 걷기 좋은가</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --muted: #6b6b6b;
    --line: #e6e6e6;
    --good: #1a7f4b;
    --normal: #b7791f;
    --rest: #c53030;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 420px; }
  .card { display: none; }
  .card.active { display: block; }

  /* 1. 한 줄 판단 */
  .verdict { font-size: 2.2rem; font-weight: 800; margin: 24px 0 8px; line-height: 1.25; }
  .verdict.good { color: var(--good); }
  .verdict.normal { color: var(--normal); }
  .verdict.rest { color: var(--rest); }

  /* 2. 근거 숫자 (작게) */
  .facts {
    list-style: none; padding: 0; margin: 16px 0 0;
    display: flex; flex-wrap: wrap; gap: 8px 16px;
    font-size: 0.8rem; color: var(--muted);
  }
  .facts b { color: var(--text); font-weight: 600; }

  /* 시간별 리스트 (판단 아래에 조용하게) */
  .best { margin: 8px 0; font-size: 0.85rem; font-weight: 600; color: var(--good); min-height: 1em; }
  .hours { list-style: none; margin: 0; padding: 0; font-size: 0.8rem; color: var(--muted); }
  .hours li, .skeleton .row {
    display: grid; grid-template-columns: 3.2rem 4.2rem 1fr 3rem;
    gap: 8px; align-items: baseline;
    padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .hours .time { color: var(--text); }
  .hours .lv.good { color: var(--good); }
  .hours .lv.normal { color: var(--normal); }
  .hours .lv.rest { color: var(--rest); }
  .hours .num { text-align: right; }
  .hours li.is-best { background: #f5faf7; font-weight: 600; }
  .skeleton { margin-top: 8px; }
  .skeleton .row { height: 34px; }
  .skeleton .row::before { content: ""; grid-column: 1 / -1; height: 10px; border-radius: 6px; background: var(--line); align-self: center; }

  /* 3. 출처 자리 */
  .source {
    margin-top: 32px; padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 0.75rem; color: var(--muted);
  }

  /* 로딩·실패: 판단 문구 자리에 들어가는 안내 (판단보다는 조용하게) */
  .status { font-size: 1.5rem; font-weight: 700; margin: 24px 0 8px; line-height: 1.35; color: var(--muted); }
  .status.error { font-size: 1rem; font-weight: 600; color: var(--muted); }
  .source a { color: var(--muted); text-decoration: underline; }
  #retry { margin-top: 16px; }
  .spinner {
    width: 24px; height: 24px; margin-top: 16px;
    border: 3px solid var(--line); border-top-color: var(--text);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  button {
    background: #000; color: #fff; border: 0;
    border-radius: 12px; padding: 12px 20px;
    font-size: 0.95rem; cursor: pointer;
  }

  /* 도시 입력 (판단보다 눈에 덜 띄게 작게) */
  .search { margin-top: 32px; display: flex; gap: 8px; }
  .search input {
    flex: 1; min-width: 0; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 12px;
    font-size: 0.85rem; color: var(--text); background: var(--bg);
  }
  .search button { padding: 8px 16px; font-size: 0.85rem; }
  .hint { margin: 8px 0 0; min-height: 1em; font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <!-- 로딩 중 -->
  <section id="loading" class="card" role="status">
    <p class="status">날씨를 불러오는 중이에요</p>
    <div class="spinner" aria-hidden="true"></div>
  </section>

  <!-- 불러오기 실패: 원인별 문구는 showError()가 넣는다 -->
  <section id="error" class="card" role="alert">
    <p id="error-text" class="status error"></p>
    <button id="retry" type="button" hidden>다시 시도</button>
  </section>

  <!-- 결과: 판단 → 근거 → 출처 -->
  <section id="result" class="card">
    <h1 id="verdict" class="verdict"></h1>
    <ul class="facts">
      <li>지역 <b id="place"></b></li>
      <li>기온 <b id="temp"></b></li>
      <li>강수 <b id="rain"></b></li>
      <li>바람 <b id="wind"></b></li>
    </ul>
  </section>

  <form id="search" class="search">
    <input id="city" type="text" placeholder="도시 이름 (예: 서울, Busan)" aria-label="도시 이름" autocomplete="off">
    <button type="submit">확인</button>
  </form>
  <p id="hint" class="hint" role="status"></p>

  <!-- 시간별 리스트: 결과일 때만 보임 (show()가 켜고 끈다) -->
  <section id="list" class="card">
    <p id="best" class="best"></p>
    <ul id="hours" class="hours" aria-label="앞으로 12시간 예보"></ul>
  </section>

  <!-- 리스트 자리 표시: 로딩 중에만 보임 -->
  <section id="skeleton" class="card skeleton" aria-hidden="true">
    <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
  </section>

  <!-- 출처: 로딩·성공·실패 모든 화면에서 항상 보인다 -->
  <p class="source">출처: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
</main>

<script>
  // 인증키 불필요 (Open-Meteo)
  const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
  const WEATHER_URL = "https://api.open-meteo.com/v1/forecast";
  // "서울"처럼 짧은 한국어 이름은 지오코딩이 못 찾거나 엉뚱한 마을을 줘서, 행정구역 접미사도 같이 찾는다
  const SUFFIXES = ["", "특별시", "광역시", "특별자치시", "특별자치도", "시"];
  let current = { name: "서울", latitude: 37.566, longitude: 126.9784 };

  // weather_code는 WMO 코드: 0~3 맑음/구름, 45~48 안개, 51 이상 비·눈 등
  function judge(c) {
    const t = c.temperature_2m, p = c.precipitation, w = c.wind_speed_10m, code = c.weather_code;
    if (p >= 1 || code >= 61 || w >= 40 || t <= -5 || t >= 33) return { text: "쉬는 게 좋아요", cls: "rest" };
    if (p > 0 || code >= 45 || w >= 25 || t < 3 || t > 28) return { text: "보통이에요", cls: "normal" };
    return { text: "걷기 좋아요", cls: "good" };
  }

  // 시간별 예보에는 기온·강수확률만 있다 (바람·날씨코드 없음)
  const LEVELS = [
    { cls: "good", text: "걷기 좋음" },
    { cls: "normal", text: "보통" },
    { cls: "rest", text: "쉼" },
  ];
  function hourLevel(t, prob) {
    if (prob >= 60 || t <= -5 || t >= 33) return 2;
    if (prob >= 30 || t < 3 || t > 28) return 1;
    return 0;
  }

  // 현재 시각이 속한 시간부터 12개. 시각은 요청한 timezone의 현지 시간 문자열이라 문자열 비교로 충분하다
  function renderHours(hourly, nowTime) {
    const start = hourly.time.findIndex(t => t >= nowTime.slice(0, 13) + ":00");
    const rows = [];
    for (let i = Math.max(start, 0); i < hourly.time.length && rows.length < 12; i++) {
      const t = hourly.temperature_2m[i], p = hourly.precipitation_probability[i];
      rows.push({ time: hourly.time[i], t, p, lv: hourLevel(t, p) });
    }
    // 가장 걷기 좋은 시간: 등급 → 강수확률 → 18°C에 가까운 기온 → 빠른 시각 순
    const best = rows.reduce((a, b) =>
      b.lv < a.lv || (b.lv === a.lv && (b.p < a.p || (b.p === a.p && Math.abs(b.t - 18) < Math.abs(a.t - 18)))) ? b : a);
    const hasBest = rows.length > 0 && best.lv < 2;

    const ul = document.getElementById("hours");
    ul.textContent = "";
    rows.forEach((r, i) => {
      const li = document.createElement("li");
      if (hasBest && r === best) li.className = "is-best";
      const cells = [
        ["time", i === 0 ? "지금" : Number(r.time.slice(11, 13)) + "시"],
        ["lv " + LEVELS[r.lv].cls, LEVELS[r.lv].text],
        ["num", r.t + "°C"],
        ["num", r.p + "%"],
      ];
      cells.forEach(([cls, text]) => {
        const s = document.createElement("span");
        s.className = cls;
        s.textContent = text;
        li.appendChild(s);
      });
      ul.appendChild(li);
    });
    const label = rows.indexOf(best) === 0 ? "지금" : Number(best.time.slice(11, 13)) + "시";
    document.getElementById("best").textContent = hasBest ? label + "이 제일 좋아요" : "";
  }

  function show(state) {
    document.querySelectorAll(".card").forEach(el => el.classList.remove("active"));
    const ids = [state];
    if (state === "result") ids.push("list");
    if (state === "loading") ids.push("skeleton");
    ids.forEach(id => document.getElementById(id).classList.add("active"));
  }

  function render(data, place) {
    const c = data.current, u = data.current_units;
    const j = judge(c);
    renderHours(data.hourly, c.time);
    document.getElementById("place").textContent = place;
    const v = document.getElementById("verdict");
    v.textContent = j.text;
    v.className = "verdict " + j.cls;
    document.getElementById("temp").textContent = c.temperature_2m + u.temperature_2m;
    document.getElementById("rain").textContent = c.precipitation + u.precipitation;
    document.getElementById("wind").textContent = c.wind_speed_10m + u.wind_speed_10m;
    show("result");
  }

  // 도시 이름 → 좌표. 후보 중 인구가 가장 많은 곳을 고르고, 못 찾으면 null
  async function geocode(name) {
    const lists = await Promise.all(SUFFIXES.map(async s => {
      const url = GEO_URL + "?count=5&language=ko&name=" + encodeURIComponent(name + s);
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return (await res.json()).results || [];
    }));
    const all = lists.flat();
    if (!all.length) return null;
    return all.reduce((a, b) => ((b.population || 0) > (a.population || 0) ? b : a));
  }

  // 원인별 실패 화면. 다시 시도 버튼은 연결/서버 오류일 때만 보인다
  const ERRORS = {
    notfound: "도시를 찾지 못했어요. 다른 이름으로 검색해 보세요",
    network: "날씨를 불러오지 못했어요. 연결을 확인해 주세요",
  };
  let retryAction = null;

  function showError(kind) {
    document.getElementById("error-text").textContent = ERRORS[kind];
    document.getElementById("retry").hidden = kind !== "network";
    show("error");
  }

  async function fetchWeather() {
    const url = WEATHER_URL + "?latitude=" + current.latitude + "&longitude=" + current.longitude
      + "&current=temperature_2m,precipitation,wind_speed_10m,weather_code"
      + "&hourly=temperature_2m,precipitation_probability&timezone=auto";
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json(), current.name);
  }

  // 도시 검색(name이 있으면)과 날씨 호출을 한 번에. 다시 시도는 같은 동작을 반복한다
  async function run(name) {
    retryAction = () => run(name);
    document.getElementById("hint").textContent = "";
    show("loading");
    try {
      if (name) {
        const found = await geocode(name);
        if (!found) { showError("notfound"); return; }
        current = { name: found.name, latitude: found.latitude, longitude: found.longitude };
      }
      await fetchWeather();
    } catch (e) {
      console.error(e);
      showError("network");
    }
  }

  document.getElementById("search").addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("city").value.trim();
    if (!name) { document.getElementById("hint").textContent = "도시 이름을 입력해 주세요."; return; }
    run(name);
  });

  document.getElementById("retry").addEventListener("click", () => retryAction());

  run();
</script>
</body>
</html>
